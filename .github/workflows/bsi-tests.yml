name: Bharat Stock Intelligence tests

on:
  push:
    branches: [main, feat/bharat-stock-intelligence-foundation]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-bsi.txt
      - name: Install CPU-only PyTorch
        run: pip install --index-url https://download.pytorch.org/whl/cpu torch
      - name: Install project dependencies
        run: pip install -r requirements-bsi.txt
      - name: Run tests
        run: python -m pytest tests/ -q
