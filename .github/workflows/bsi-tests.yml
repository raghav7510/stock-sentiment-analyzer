name: Bharat Stock Intelligence tests
on:
  push:
    branches: [main, feat/bharat-stock-intelligence-foundation]
  pull_request:
    branches: [main]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-bsi.txt
      - run: pytest -q
