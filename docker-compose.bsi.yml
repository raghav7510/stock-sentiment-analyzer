services:
  db:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_DB: bsi
      POSTGRES_USER: bsi
      POSTGRES_PASSWORD: bsi
    ports:
      - "5432:5432"
    volumes:
      - bsi_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bsi -d bsi"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  bsi_pgdata:
